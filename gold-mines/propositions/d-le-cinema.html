<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOLD MINES — Accueil · Le Cinéma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="propositions.css">
</head>
<body class="loaded">
<header class="nav" id="nav">
  <div class="nav__left">
    <button class="nav__menu" aria-label="Menu"><span></span><span></span></button>
    <a href="#">Collections</a>
    <a href="#">Créer mon bijou</a>
  </div>
  <a href="#" class="logo" aria-label="GOLD MINES by Orpaz">
    <span class="logo__mark gold-text">GOLD MINES</span>
    <span class="logo__sub">— by Orpaz —</span>
  </a>
  <div class="nav__right">
    <a href="#">Rendez-vous</a>
    <button aria-label="Favoris"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    <button aria-label="Panier" class="cart"><svg viewBox="0 0 24 24"><path d="M5.5 8.5h13l-1 11.5h-11z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/></svg><span class="cart__count">0</span></button>
  </div>
</header>

<section class="pD" id="pD">
  <div class="slide on"><img src="../img/hero.jpg" alt="" style="object-position:66% 50%"></div>
  <div class="slide"><img src="../img/necklace.jpg" alt=""></div>
  <div class="slide"><img src="../img/earrings-b.jpg" alt="" style="object-position:62% 50%"></div>
  <div class="pD__copy">
    <div class="pD__num gold-text" id="num">01</div>
    <p class="kick" id="kick"><i></i>Collection Signature</p>
    <h1 class="big" id="title">L'art de la joaillerie<em>réinventé</em></h1>
    <p class="lead" id="lead">Des créations d'exception, imaginées par vous et réalisées par nos artisans.</p>
    <div class="ctas"><a href="#" class="btn btn--gold"><span id="cta">Découvrir la collection</span></a><a href="#" class="btn btn--frame"><span>Créer mon bijou</span></a></div>
  </div>
  <div class="pD__side"><button class="on" data-i="0">01<i></i></button><button data-i="1">02<i></i></button><button data-i="2">03<i></i></button></div>
  <div class="pD__thumbs"><button class="on" data-i="0"><img src="../img/hero.jpg" alt=""></button><button data-i="1"><img src="../img/necklace.jpg" alt=""></button><button data-i="2"><img src="../img/earrings-b.jpg" alt=""></button></div>
</section>
<div class="tag">Proposition D · Le Cinéma</div>
<script>
const D=[
 ['Collection Signature','L\'art de la joaillerie<em>réinventé</em>','Des créations d\'exception, imaginées par vous et réalisées par nos artisans.','Découvrir la collection'],
 ['Haute Joaillerie','Rivière<em>de lumière</em>','Un saphir royal, cinquante-deux diamants, une seule main pour les assembler.','Découvrir les colliers'],
 ['Créations sur mesure','Votre histoire<em>sertie d\'or</em>','Imaginez votre bijou, notre atelier de la rue Bleue lui donne vie.','Créer mon bijou']];
let i=0, timer; const sl=[...document.querySelectorAll('.slide')], bs=[...document.querySelectorAll('[data-i]')];
function show(n){ i=n; sl.forEach((s,k)=>s.classList.toggle('on',k===n)); bs.forEach(b=>{ b.classList.remove('on'); void b.offsetWidth; b.classList.toggle('on',+b.dataset.i===n); });
 num.textContent='0'+(n+1); kick.innerHTML='<i></i>'+D[n][0]; title.innerHTML=D[n][1]; lead.textContent=D[n][2]; cta.textContent=D[n][3];
 clearTimeout(timer); timer=setTimeout(()=>show((i+1)%3),6000); }
bs.forEach(b=>b.onclick=()=>show(+b.dataset.i)); show(+(location.hash.slice(1)||0));
</script>
</body>
</html>
